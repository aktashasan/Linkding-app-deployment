name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'manifests/**'
      - 'linkding-source/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.APPLICATION_NAME }}
  NAMESPACE: ${{ secrets.NAMESPACE }}
  DEPLOYMENT: ${{ secrets.DEPLOYMENT }}

jobs:
  # Job 1: Build and Push Docker Image (Normal GitHub Runner)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      image_url: ${{ steps.image_url.outputs.url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check or clone linkding-source
      run: |
        if [ ! -d "linkding-source" ]; then
          echo "linkding-source not found, cloning from GitHub..."
          git clone https://github.com/sissbruecker/linkding.git linkding-source
          cd linkding-source
          # Belirli bir tag veya branch kullanmak isterseniz:
          # git checkout v1.23.0
          cd ..
        fi
        echo "linkding-source directory ready"
        ls -la linkding-source/ | head -20

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'workflow_dispatch'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        registry: ${{ secrets.REGISTRY }}

    - name: Determine image tag
      id: image_tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Set image URL
      id: image_url
      run: |
        REGISTRY="${{ secrets.REGISTRY }}"
        if [ -z "$REGISTRY" ]; then
          REGISTRY="docker.io"
        fi
        IMAGE_URL="${REGISTRY}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}"
        echo "url=${IMAGE_URL}" >> $GITHUB_OUTPUT
        echo "Image URL: ${IMAGE_URL}"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./linkding-source
        file: ./linkding-source/docker/default.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
        cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ secrets.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
        # Note: buildcache image is used for Docker layer caching, this is normal and expected
        # Multi-platform build (amd64 + arm64) for compatibility with different cluster architectures

  # Job 2: Deploy to Kubernetes (Self-Hosted Runner - Lokal Cluster Erişimi İçin)
  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success')
    
    steps:
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      id: kubeconfig_check
      run: |
        mkdir -p ~/.kube
        
        # Öncelik 1: Kind cluster'dan direkt kubeconfig export et (en güvenilir)
        if command -v kind &> /dev/null; then
          KIND_CLUSTERS=$(kind get clusters 2>/dev/null || echo "")
          if [ -n "$KIND_CLUSTERS" ]; then
            KIND_CLUSTER=$(echo "$KIND_CLUSTERS" | head -1 | tr -d '[:space:]')
            echo "✅ Found Kind cluster: $KIND_CLUSTER"
            echo "Exporting fresh kubeconfig..."
            kind export kubeconfig --name "$KIND_CLUSTER" --kubeconfig ~/.kube/config
            
            if kubectl cluster-info --request-timeout=10s 2>/dev/null; then
              echo "✅ Cluster connection successful!"
              echo "kubeconfig_available=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "⚠️  Cannot connect after Kind export, trying other methods..."
            fi
          else
            echo "⚠️  No Kind clusters found"
          fi
        else
          echo "⚠️  Kind command not found"
        fi
        
        # Öncelik 2: GitHub secret'tan kubeconfig kullan
        if [ -n "${{ secrets.KUBECONFIG }}" ]; then
          echo "Trying kubeconfig from GitHub secret..."
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          
          if kubectl cluster-info --request-timeout=10s 2>/dev/null; then
            echo "✅ Cluster connection successful with secret kubeconfig!"
            echo "kubeconfig_available=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "⚠️  Cannot connect with secret kubeconfig"
          fi
        fi
        
        # Öncelik 3: Default kubeconfig
        if [ -f "$HOME/.kube/config" ]; then
          echo "Trying default kubeconfig at $HOME/.kube/config..."
          if kubectl cluster-info --request-timeout=10s 2>/dev/null; then
            echo "✅ Cluster connection successful with default kubeconfig!"
            echo "kubeconfig_available=true" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi
        
        # Hiçbir yöntem çalışmadı
        echo "❌ ERROR: Cannot connect to Kubernetes cluster"
        echo ""
        echo "Troubleshooting:"
        echo "1. Check if Kind cluster is running:"
        echo "   kind get clusters"
        echo ""
        echo "2. If cluster exists, test connection:"
        echo "   kind export kubeconfig --name kind-cluster"
        echo "   kubectl cluster-info"
        echo ""
        echo "3. If working locally, update GitHub secret:"
        echo "   kind export kubeconfig --name kind-cluster | base64"
        echo "   Add output as KUBECONFIG secret in GitHub"
        echo ""
        echo "kubeconfig_available=false" >> $GITHUB_OUTPUT
        exit 1

    - name: Deploy to Kubernetes
      if: steps.kubeconfig_check.outputs.kubeconfig_available == 'true'
      run: |
        echo "Deploying image: ${{ needs.build-and-push.outputs.image_url }}"
        echo "Image tag: ${{ needs.build-and-push.outputs.image_tag }}"
        echo "Namespace: ${{ env.NAMESPACE }}"
        echo "Deployment: ${{ env.DEPLOYMENT }}"
        
        # Cluster bağlantısını kontrol et
        kubectl cluster-info || {
          echo "ERROR: Cannot connect to Kubernetes cluster"
          exit 1
        }
        
        # Namespace'in var olduğundan emin ol
        if ! kubectl get namespace ${{ env.NAMESPACE }} &>/dev/null; then
          echo "WARNING: Namespace ${{ env.NAMESPACE }} does not exist. Creating..."
          kubectl create namespace ${{ env.NAMESPACE }}
        fi
        
        # Deployment'ın var olduğundan emin ol
        if ! kubectl get deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }} &>/dev/null; then
          echo "WARNING: Deployment ${{ env.DEPLOYMENT }} does not exist in namespace ${{ env.NAMESPACE }}"
          echo "Please deploy the application first using: ./setup.sh"
          exit 1
        fi
        
        # Mevcut image'ı göster
        echo "Current deployment image:"
        kubectl get deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}'
        echo ""
        
        # Yeni image'ı göster
        NEW_IMAGE="${{ needs.build-and-push.outputs.image_url }}"
        echo "New image to deploy: $NEW_IMAGE"
        echo ""
        
        # Image tag'ini güncelle (rolling update)
        echo "Updating deployment image..."
        kubectl set image deployment/${{ env.DEPLOYMENT }} \
          linkding=$NEW_IMAGE \
          -n ${{ env.NAMESPACE }}
        
        # Güncellenmiş image'ı kontrol et
        echo "Updated deployment image:"
        kubectl get deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}'
        echo ""
        
        # Pod durumunu kontrol et
        echo "Current pod status:"
        kubectl get pods -n ${{ env.NAMESPACE }} -l app=linkding
        echo ""
        
        # Rolling update durumunu bekle (timeout: 10 dakika)
        echo "Waiting for rollout to complete (timeout: 10 minutes)..."
        if kubectl rollout status deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }} --timeout=600s; then
          echo "✅ Rollout completed successfully!"
        else
          echo "❌ WARNING: Rollout timeout or failed. Gathering diagnostic information..."
          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=linkding -o wide
          echo ""
          echo "Recent events:"
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -15
          echo ""
          echo "Deployment status:"
          kubectl get deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }}
          echo ""
          echo "Pod describe (first failing pod):"
          FAILING_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=linkding -o jsonpath='{.items[?(@.status.phase!="Running")].metadata.name}' | cut -d' ' -f1)
          if [ -n "$FAILING_POD" ]; then
            kubectl describe pod/$FAILING_POD -n ${{ env.NAMESPACE }}
          else
            kubectl describe pod -n ${{ env.NAMESPACE }} -l app=linkding | head -80
          fi
          echo ""
          echo "Pod logs (first pod):"
          FIRST_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=linkding -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$FIRST_POD" ]; then
            kubectl logs $FIRST_POD -n ${{ env.NAMESPACE }} --tail=50 || echo "Could not get logs"
          fi
          exit 1
        fi

    - name: Verify deployment
      if: steps.kubeconfig_check.outputs.kubeconfig_available == 'true'
      run: |
        echo "Deployment status:"
        kubectl get deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }}
        echo ""
        echo "Pod status:"
        kubectl get pods -n ${{ env.NAMESPACE }} -l app=linkding
        echo ""
        echo "Deployed image: ${{ needs.build-and-push.outputs.image_url }}"
        echo ""
        echo "Rollout history:"
        kubectl rollout history deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }}
    
    - name: Deployment instructions (if KUBECONFIG not set)
      if: steps.kubeconfig_check.outputs.kubeconfig_available == 'false'
      run: |
        echo "=========================================="
        echo "Image built and pushed successfully!"
        echo "=========================================="
        echo ""
        echo "Image: ${{ needs.build-and-push.outputs.image_url }}"
        echo ""
        echo "To deploy to your local Kubernetes cluster:"
        echo "1. Make sure your cluster is running"
        echo "2. Run the following command:"
        echo ""
        echo "   kubectl set image deployment/${{ env.DEPLOYMENT }} \\"
        echo "     linkding=${{ needs.build-and-push.outputs.image_url }} \\"
        echo "     -n ${{ env.NAMESPACE }}"
        echo ""
        echo "Or use the rolling-update script:"
        echo "   ./scripts/rolling-update.sh ${{ needs.build-and-push.outputs.image_tag }}"
        echo ""
        echo "=========================================="
