apiVersion: v1
kind: ConfigMap
metadata:
  name: linkding-config
  namespace: linkding
data:
  LD_DB_ENGINE: "postgres"
  LD_DB_NAME: "linkding"
  LD_DB_USER: "linkding"
  LD_DB_HOST: "postgres"
  LD_DB_PORT: "5432"
  LD_SUPERUSER_NAME: "admin"
  LD_SUPERUSER_EMAIL: "admin@example.com"
  LD_DISABLE_BACKGROUND_TASKS: "false"
  LD_ENABLE_BOOKMARK_ARCHIVING: "true"
  LD_ENABLE_BOOKMARK_LINK_CHECKING: "true"
  
  LD_SERVER_PORT: "9090"
  LD_SERVER_HOST: "0.0.0.0"
